# Perfil "postgres": sobrescribe la configuracion de H2.
# Levanta la base con:  docker compose up -d   (o crea la BD "arena" en tu PostgreSQL local)
spring.datasource.url=jdbc:postgresql://localhost:5432/arena
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.h2.console.enabled=false

# update: conserva los datos entre reinicios
spring.jpa.hibernate.ddl-auto=update
arena.cargar-demo=false

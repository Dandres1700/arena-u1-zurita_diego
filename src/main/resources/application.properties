spring.application.name=arena-u1

# --- Base de datos por defecto: H2 en memoria (no hay que instalar nada) ---
spring.datasource.url=jdbc:h2:mem:arena;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: la de arriba)
spring.h2.console.enabled=true

# Hibernate crea las tablas a partir de las entidades y las borra al apagar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga 4 jugadores y 1 torneo de ejemplo al arrancar (pon false para empezar vacio)
arena.cargar-demo=true

# Para usar PostgreSQL:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
